<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .title { fill: #1f2328; font-size: 16px; font-weight: 600; }
    .note { fill: #59636e; font-size: 13px; }
    .n { fill: #1f2328; font-size: 14px; text-anchor: end; }
