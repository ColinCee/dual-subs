<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { fill: #59636e; font-size: 13px; text-anchor: middle; }
    .a { stroke: #59636e; stroke-width: 1.5; fill: none; marker-end: url(#h); }
    .hd { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #151b23; stroke: #3d444d; }
      .key { fill: #0c2d6b; stroke: #4493f8; }
      .t { fill: #f0f6fc; }
      .s, .hd { fill: #9198a1; }
      .a { stroke: #9198a1; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="hd" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="30" width="160" height="180" rx="10"/>
  <text class="t" x="90" y="114">Episode .mkv</text>
  <text class="s" x="90" y="134">Mandarin audio,</text>
  <text class="s" x="90" y="152">English subtitles</text>

  <rect class="box" x="230" y="30" width="190" height="70" rx="10"/>
  <text class="t" x="325" y="60">Transcribe</text>
  <text class="s" x="325" y="80">FireRedASR2, GPU</text>

  <rect class="box" x="230" y="140" width="190" height="70" rx="10"/>
  <text class="t" x="325" y="170">English subtitles</text>
  <text class="s" x="325" y="190">from the episode</text>

  <rect class="box" x="480" y="30" width="240" height="180" rx="10"/>
  <text class="t" x="600" y="96">Fix and merge</text>
  <text class="s" x="600" y="118">Claude corrects the Chinese</text>
  <text class="s" x="600" y="136">against the English line,</text>
  <text class="s" x="600" y="154">then each pair is timed together</text>

  <rect class="key" x="780" y="30" width="170" height="180" rx="10"/>
  <text class="t" x="865" y="114">Episode .mkv</text>
  <text class="s" x="865" y="134">中文 + English</text>
  <text class="s" x="865" y="152">track as default</text>

  <path class="a" d="M170,65 H228"/>
  <path class="a" d="M170,175 H228"/>
  <path class="a" d="M420,65 H478"/>
  <path class="a" d="M420,175 H478"/>
  <path class="a" d="M720,120 H778"/>
</svg>
