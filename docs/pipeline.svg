<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .key { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
    .t { fill: #1f2328; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .s { fill: #59636e; font-size: 13px; text-anchor: middle; }
    .a { stroke: #59636e; stroke-width: 1.5; fill: none; marker-end: url(#h); }
    .hd { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #151b23; stroke: #3d444d; }
      .key { fill: #0c2d6b; stroke: #4493f8; }
      .t { fill: #f0f6fc; }
      .s, .hd { fill: #9198a1; }
      .a { stroke: #9198a1; }
    }
  </style>
  <defs>
    <marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path class="hd" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <!-- column 0: input episode, both rows -->
  <rect class="box" x="10" y="30" width="150" height="180" rx="10"/>
  <text class="t" x="85" y="114">Episode .mkv</text>
  <text class="s" x="85" y="134">Mandarin audio,</text>
  <text class="s" x="85" y="152">English subtitles</text>

  <!-- row 1: Chinese -->
  <rect class="box" x="210" y="30" width="160" height="70" rx="10"/>
  <text class="t" x="290" y="60">Transcribe</text>
  <text class="s" x="290" y="80">FireRedASR2, GPU</text>

  <rect class="box" x="410" y="30" width="160" height="70" rx="10"/>
  <text class="t" x="490" y="60">Proofread</text>
  <text class="s" x="490" y="80">Claude + cast list</text>

  <!-- row 2: English -->
  <rect class="box" x="210" y="140" width="360" height="70" rx="10"/>
  <text class="t" x="390" y="170">English subtitles</text>
  <text class="s" x="390" y="190">kept as they are</text>

  <!-- column 3: merge, both rows -->
  <rect class="box" x="620" y="30" width="140" height="180" rx="10"/>
  <text class="t" x="690" y="114">Merge</text>
  <text class="s" x="690" y="134">one row of each,</text>
  <text class="s" x="690" y="152">timed together</text>

  <!-- column 4: output -->
  <rect class="key" x="800" y="30" width="150" height="180" rx="10"/>
  <text class="t" x="875" y="114">Episode .mkv</text>
  <text class="s" x="875" y="134">中文 + English</text>
  <text class="s" x="875" y="152">track as default</text>

  <path class="a" d="M160,65 H208"/>
  <path class="a" d="M370,65 H408"/>
  <path class="a" d="M570,65 H618"/>
  <path class="a" d="M160,175 H208"/>
  <path class="a" d="M570,175 H618"/>
  <path class="a" d="M760,120 H798"/>
</svg>
